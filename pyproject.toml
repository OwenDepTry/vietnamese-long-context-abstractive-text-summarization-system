[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnsum"
version = "0.1.0"
description = "Vietnamese long-context abstractive summarization"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Lỗi thật (cú pháp, tên chưa định nghĩa, import thừa...), không bắt lỗi kiểu dáng; CI chạy `ruff check`.
select = ["E9", "F"]
